name: Release

# Push a tag like v2.0.1 to build the exe and publish a GitHub Release with it attached.
# "Run workflow" on the Actions tab builds the same files as a downloadable artifact (no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $version = if ($ref -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { "0.0.0-dev" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Self-test
        shell: pwsh
        run: |
          dotnet build -c Release -o build
          # It's a GUI exe, so wait for it explicitly to get the exit code.
          $p = Start-Process .\build\MonitorDimmer.exe -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Publish standalone exe (no .NET needed)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o dist/standalone

      - name: Publish small exe (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o dist/small

      - name: Name release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/standalone/MonitorDimmer.exe out/MonitorDimmer.exe
          Copy-Item dist/small/MonitorDimmer.exe out/MonitorDimmer-small-needs-dotnet8.exe
          Get-ChildItem out | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorDimmer-${{ steps.version.outputs.version }}
          path: out/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Download ``MonitorDimmer.exe``** and run it — no install, no .NET needed.

          ``MonitorDimmer-small-needs-dotnet8.exe`` is the same app at a fraction of the size, but requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0).

          Windows may show *"Windows protected your PC"* because the exe isn't code-signed: click **More info → Run anyway**.
          "@
          gh release create "${{ github.ref_name }}" out/* --title "Monitor Dimmer ${{ steps.version.outputs.version }}" --notes $notes --generate-notes
